<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartVaga - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>

    <header class="auth-header">
        <div class="logo">SmartVaga</div>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <h1 class="auth-title">Bem-vindo!</h1>
            
            <form class="auth-form" id="formLogin">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="Introduz o teu email" required>
                </div>

                <div class="input-group">
                    <label for="login-pass">Password</label>
                    <input type="password" id="login-pass" placeholder="Password" required>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-action btn-orange" onclick="window.location.href='registar.html'">
                        Registar
                    </button>
                    <button type="submit" class="btn-action btn-green">
                        Login
                    </button>
                </div>
                
                <p>Ainda não tens conta? <a href="registar.html">Regista-te aqui</a></p>

                <div class="form-footer">
                    <a href="esquecer-password.html" class="auth-link">Esqueceu da password?</a>
                </div>
            </form>
        </section>
    </main>

    <script src="../JS/script.js"></script>
</body>
</html>
