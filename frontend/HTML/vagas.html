<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartVaga - Vagas</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/vagas.css">
</head>
<body>

    <nav>
        <div class="logo">SmartVaga</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="vagas.html">Vagas</a></li>
            <li><a href="carregamentos.html">Carregamentos</a></li>
            <li><a href="contactos.html">Contactos</a></li>
        </ul>
        
        <div class="user-profile">
            <svg class="profile-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
            <span class="profile-name">Nome</span>
        </div>
    </nav>

    <main class="vagas-main">
        <div class="vagas-filters">
            <div class="piso-selector-container">
                <button class="piso-btn">Piso 0</button>
                <button class="piso-btn active">Piso -1</button>
                <button class="piso-btn">Piso -2</button>
            </div>
            
            <div class="checkbox-group-horizontal">
                <label class="custom-check">
                    <input type="checkbox"> Normal
                </label>
                <label class="custom-check">
                    <input type="checkbox"> Elétrico
                </label>
                <label class="custom-check">
                    <input type="checkbox"> Mostrar apenas vagas livres
                </label>
            </div>
        </div>

        <div class="cards-grid">
            <div class="stat-card">
                <div class="number">0</div>
                <p>Vagas livres</p>
            </div>
            <div class="stat-card">
                <div class="number">0</div>
                <p>Vagas de carregamento livres</p>
            </div>
            <div class="stat-card">
                <div class="number">0</div>
                <p>Vagas reservadas</p>
            </div>
        </div>

        <div class="reserva-footer">
            <a href="reservas.html" style="text-decoration: none; width: 100%; display: flex; justify-content: center;">
                <button class="btn-reserva-vagas">Pretende reservar?</button>
            </a>
        </div>
    </main>

</body>
</html>
