<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartVaga - Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="perfil.css">
</head>
<body>

    <nav>
        <div class="logo">SmartVaga</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="vagas.html">Vagas</a></li>
            <li><a href="carregamentos.html">Carregamentos</a></li>
            <li><a href="contactos.html">Contactos</a></li>
        </ul>
        <div class="user-profile">
            <svg class="profile-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
            <span class="profile-name">Nome</span>
        </div>
    </nav>

    <main class="perfil-container">
        <div class="painel-cinzento">
            
            <aside class="perfil-sidebar">
                <div class="avatar-grande">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                </div>
                
                <nav class="sidebar-menu">
                    <button class="sidebar-btn active">Editar Perfil</button>
                    <button class="sidebar-btn">Atividade</button>
                    <button class="sidebar-btn"> Veículo</button>
                    <button class="sidebar-btn">Pagamento</button>
                </nav>
            </aside>

            <section class="perfil-conteudo">
                
                <div class="aba-conteudo" id="aba-editar">
                    <h2 class="titulo-aba">Editar Perfil</h2>
                    
                    <form class="perfil-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Nome</label>
                                <input type="text" placeholder="Nome" value="Nome">
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" placeholder="E-mail">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group" style="max-width: calc(50% - 15px);">
                                <label>Password</label>
                                <input type="password" placeholder="Password">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-editar"> Editar</button>
                            <button type="button" class="btn-eliminar"> Eliminar conta</button>
                        </div>
                    </form>
                </div>

                </section>
        </div>
    </main>

</body>
</html>
