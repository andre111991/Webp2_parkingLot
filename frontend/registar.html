<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartVaga - Registar Conta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="registar.css">
</head>
<body>

    <header class="auth-header">
        <div class="logo">SmartVaga</div>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <h1 class="auth-title">Registar conta</h1>
            
            <form class="auth-form" action="index.html" method="POST">
                <div class="input-group">
                    <label for="reg-nome">Nome</label>
                    <input type="text" id="reg-nome" placeholder="Nome" required>
                </div>

                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="E-mail" required>
                </div>

                <div class="input-group">
                    <label for="reg-pass">Password</label>
                    <input type="password" id="reg-pass" placeholder="Password" required>
                </div>

                <div class="button-container">
                    <button type="submit" class="btn-registar">Registar</button>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
